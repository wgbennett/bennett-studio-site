<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bennett Studio — software for makers</title>
    <meta name="description" content="Bennett Studio builds focused, mobile-first software for people who sell what they make. Four apps available now: MarginPrint for 3D-print shops, MarketDay for selling in person, Benchstock for materials, and Maker Books for the numbers." />
    <meta name="theme-color" content="#B8451F" />
    <!-- Update to the real production domain before deploy (assumed bennettstudio.dev). -->
    <link rel="canonical" href="https://bennettstudio.dev/" />

    <!-- Favicon: ascending three-bar mark, bone bg with copper base bar -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph (Facebook, iMessage, Discord, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bennettstudio.dev/" />
    <meta property="og:title" content="Bennett Studio — software for makers" />
    <meta property="og:description" content="Four focused, mobile-first apps available now for people who sell what they make: MarginPrint for 3D-print shops, MarketDay for selling in person, Benchstock for materials, and Maker Books for the numbers." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bennett Studio — software for makers." />
    <meta property="og:site_name" content="Bennett Studio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bennett Studio — software for makers" />
    <meta name="twitter:description" content="Four focused, mobile-first apps available now for people who sell what they make: MarginPrint for 3D-print shops, MarketDay for selling in person, Benchstock for materials, and Maker Books for the numbers." />
    <meta name="twitter:image" content="/og.png" />

    <!-- og.png is a real-app composite (queue + profit breakdown) rendered at
         1200x630. Source template + capture script: /tmp/og-template.html +
         /tmp/mp-og.mjs (regenerate after a UI refresh). og.svg kept as a
         vector fallback. -->

    <!-- Type is SELF-HOSTED (public/fonts/fonts.css). It used to come from
         fonts.googleapis.com via a render-blocking stylesheet, which put a
         third-party origin in the critical path: with that request hanging,
         the browser paints nothing at all. Now it is the same origin as the
         HTML — no extra DNS, no extra TLS.

         Only the two faces above the fold are preloaded. Anton draws the
         hero headline, so it is fetched in parallel with the CSS rather than
         after it; Inter is the body face and appears everywhere. Instrument
         Serif is deliberately NOT preloaded — it decorates copy further down
         and swaps in without anyone noticing. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
