<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root { --bone:#F5F1EA; --ink:#1A1A1A; --copper:#B8451F; --charcoal:#1F1B17; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  .canvas {
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:var(--bone);
    font-family:'Inter', system-ui, sans-serif; color:var(--ink);
  }
  /* grid texture (matches Hero / og.svg) */
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(26,26,26,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(26,26,26,0.05) 1px, transparent 1px);
    background-size:44px 44px;
  }
  /* warm copper glow bleeding from the right behind the phone */
  .glow {
    position:absolute; right:-120px; top:50%; transform:translateY(-50%);
    width:760px; height:760px; border-radius:50%;
    background:radial-gradient(circle, rgba(184,69,31,0.16), rgba(184,69,31,0) 62%);
  }

  .eyebrow {
    position:absolute; left:80px; top:64px;
    display:flex; align-items:center; gap:14px;
    font-family:'JetBrains Mono', monospace; font-size:18px;
    letter-spacing:2.4px; color:rgba(26,26,26,0.55);
  }
  .eyebrow .dot { width:9px; height:9px; border-radius:50%; background:var(--copper); }
  .eyebrow .sep { opacity:0.35; }

  .headline {
    position:absolute; left:80px; top:150px; width:640px;
  }
  .headline .l1 { font-size:118px; font-weight:700; letter-spacing:-4px; line-height:1.02; }
  .headline .l2 { font-size:118px; font-weight:500; font-style:italic; letter-spacing:-4px; line-height:1.02; color:rgba(26,26,26,0.82); }
  .headline .l1 .accent { color:var(--copper); }

  .subhead {
    position:absolute; left:82px; top:472px; width:600px;
    font-size:27px; line-height:1.4; color:rgba(26,26,26,0.62);
  }

  .byline {
    position:absolute; left:82px; bottom:56px;
    font-family:'JetBrains Mono', monospace; font-size:19px; letter-spacing:2px;
  }
  .byline .by { opacity:0.45; }

  /* Phone mockup on the right */
  .phone {
    position:absolute; right:96px; top:50%;
    transform:translateY(-50%) rotate(-5deg);
    width:286px; height:586px;
    background:#0d0d10; border-radius:46px;
    padding:11px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.18) inset,
      0 40px 80px -20px rgba(26,26,26,0.45),
      0 12px 28px -8px rgba(26,26,26,0.35);
  }
  .phone .screen {
    width:100%; height:100%; border-radius:36px; overflow:hidden;
    background:#0f1117;
  }
  .phone .screen img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  /* a faint second phone peeking behind, for depth */
  .phone.back {
    right:300px; width:250px; height:512px;
    transform:translateY(-50%) rotate(-9deg);
    opacity:0.5; filter:saturate(0.9);
    box-shadow:0 30px 60px -24px rgba(26,26,26,0.4);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="phone back">
      <div class="screen">
        <img src="file:///Users/williambennett/print-calc/bennett-studio-site/site/public/screenshots/calculator-result.png" alt="" />
      </div>
    </div>
    <div class="phone">
      <div class="screen">
        <img src="file:///Users/williambennett/print-calc/bennett-studio-site/site/public/screenshots/queue.png" alt="" />
      </div>
    </div>

    <div class="eyebrow">
      <span class="dot"></span>
      <span>MARGINPRINT</span>
      <span class="sep">·</span>
      <span>V0.4.2</span>
      <span class="sep">·</span>
      <span>IN BETA</span>
    </div>

    <div class="headline">
      <div class="l1">The queue<br/>is the app<span class="accent">.</span></div>
    </div>

    <div class="subhead">Mobile-first operations for small 3D&nbsp;print sellers.</div>

    <div class="byline"><span class="by">BY</span> BENNETT STUDIO</div>
  </div>
</body>
</html>
